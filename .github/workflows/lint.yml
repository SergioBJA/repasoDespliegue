name: Pylint

on: 
  pull_request:
    branches:
      - main
    paths: 
      - '**/*.py' # Solo se activa si modificas o subes archivos de Python

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"] # El examen probará tu código en ambas versiones
    steps:
      # Paso 1: Clonar el código dentro del contenedor temporal de GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Paso 2: Instalar la versión de Python correspondiente
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Paso 3: Instalar las dependencias de limpieza de código
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      # Paso 4: Pasar el "escáner" (pylint) a todos los archivos .py
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')