name: CD - Build and Push to Docker Hub

# El robot se activará SOLAMENTE cuando se haga un push a la rama principal (main o principal)
on:
  push:
    branches: [ "main", "principal" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código de nuestro repositorio en la máquina de GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Iniciar sesión en Docker Hub usando los Secretos que hemos guardado antes
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Construir la imagen de Docker y subirla (Push) automáticamente
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # CAMBIA 'TU_USUARIO_DOCKERHUB' por tu usuario real de Docker Hub:
        tags: |
          sergiobja/repaso-despliegue:latest